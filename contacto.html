<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerdito's Games</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
 


<body>
    <header class="site-header">
        <div class="container">
            <h1 class="brand-banner">
                <img src="img/banner (1).png" alt="Cerdito's Games">
            </h1>
            <p class="site-tagline">Desarrollo independiente de videojuegos</p>
            <button id="menu-button" type="button" aria-expanded="false" aria-controls="page-menu"
                    aria-label="Abrir menú">☰</button>
            <nav id="page-menu" aria-label="Menú principal">
                <ul>
                    <li><a href="index.html" >Inicio</a></li>
                    <li><a href="sobre_mi.html">Sobre mí</a></li>
                    <li><a href="juegos.html">Juegos</a></li>
                    <li><a href="contacto.html"aria-current="page">Contacto</a></li>
                    <li><a href="actualizaciones.html">Actualizaciones</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main class="container page-content">
        <section class="intro-card">
            <p class="eyebrow">¡Contactame!</p>
            <h2>Envíame un mensaje</h2>
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" minlength="10" required></textarea>
                <small id="mensaje-error" aria-live="polite"></small>

                <button class="button" type="submit">Enviar mensaje</button>
            </form>
            
        </section>
    </main>

 <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Cerdito's Games. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
